; This is a development container whose code lives on a bind mount.
;
; Timestamp validation is disabled on purpose: a `stat` on this Windows bind
; mount costs ~10ms, and OPcache checks thousands of scripts per request, which
; made every page take 5-10s. Keep this at 0 and restart the app container after
; editing PHP files:  docker compose restart app
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.enable_file_override=0
opcache.consistency_checks=0
