services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-vue-app
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-compose/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - laravel-net

  webserver:
    image: nginx:alpine
    container_name: laravel_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/conf.d:/etc/nginx/conf.d/
    networks:
      - laravel-net

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_vue_ecommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-net

  node:
    image: node:20-alpine
    container_name: laravel_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:3001"
    command: sh -c "npm install && npm run dev"

  backend-node:
    image: node:20-alpine
    container_name: laravel_backend_node
    working_dir: /var/www/backend
    volumes:
      - .:/var/www
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  dbdata:
    driver: local